name: Reporte de bug
description: Algo no funciona como debería.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. Con los pasos para reproducirlo y lo que diga la
        consola del navegador alcanza casi siempre para encontrar la causa.

  - type: checkboxes
    id: previo
    attributes:
      label: Antes de abrir el issue
      options:
        - label: Busqué entre los issues abiertos y no encontré el mismo problema.
          required: true
        - label: Recargué la página con la pestaña cerrada y vuelta a abrir, y el problema sigue.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Área
      description: Dónde aparece el problema.
      options:
        - Lienzo y edición
        - Validación UML (las 17 reglas)
        - Requisitos (importar PDF, Markdown o TXT)
        - Planillas (importador estructurado de Markdown)
        - Exportación (SVG, PNG, JSON)
        - Biblioteca (diagramas guardados)
        - Agentes y conector MCP
        - Proveedores de modelo (LLM)
        - Despliegue y build
        - Otra cosa
    validations:
      required: true

  - type: dropdown
    id: donde
    attributes:
      label: Dónde lo viste
      options:
        - En diagrams.ohmy.lat
        - Corriendo el proyecto localmente (bun dev)
        - En una build local (bun run build)
    validations:
      required: true

  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué hace la aplicación y qué esperabas que hiciera.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Desde el lienzo vacío, si se puede.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: consola
    attributes:
      label: Consola del navegador
      description: Errores en rojo de la pestaña Console y peticiones fallidas en Network. Se pega tal cual, sin formatear.
      render: text

  - type: input
    id: entorno
    attributes:
      label: Navegador y sistema operativo
      placeholder: Chrome 141 en Windows 11

  - type: input
    id: version
    attributes:
      label: Commit o fecha
      description: El commit si corrés el proyecto localmente; si es el sitio publicado, cuándo lo viste.

  - type: textarea
    id: extra
    attributes:
      label: Archivo de ejemplo
      description: El JSON del diagrama, el PDF o el Markdown con el que pasa. Arrastralo acá.
